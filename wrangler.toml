name = "my-project"
main = "./src/ssr.tsx"
# Pinned to the newest date the installed workerd supports, not to today's date:
# a date beyond that ceiling makes the local runtime refuse to start, so
# `vite dev` breaks for everyone. Raise it only together with wrangler.
compatibility_date = "2026-07-15"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "local-db"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "AVATARS_BUCKET"
bucket_name = "local-avatars"

[vars]
BETTER_AUTH_URL = "http://localhost:5173"

# Declared so `wrangler types` emits these on CloudflareEnv deterministically.
# Values are never here — they are registered with `wrangler secret put`.
# Without this block the generator falls back to whatever local env
# file it finds, so the type differs between a developer machine and CI.
#
# Naming a secret here also makes it required at deploy time, so register it with
# `wrangler secret put` before adding the name — see docs/DEPLOYMENT.md.
[secrets]
required = ["BETTER_AUTH_SECRET", "GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET"]
