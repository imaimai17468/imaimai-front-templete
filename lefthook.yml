# Check-only on pre-commit: auto-fix (--fix / --write + stage_fixed)
# rewrote staged content at commit time, so the committed bytes could differ
# from what the code-reviewer agent reviewed. A failing check tells the author
# to run `bun run check:fix` and re-stage — the reviewed diff is what lands.
pre-commit:
  commands:
    lint:
      # oxlint exits 1 with "No files found to lint" when every path it gets
      # sits outside `bun run lint`'s directories, so an unscoped glob lets a
      # root-level config file block the commit.
      glob:
        - "src/*.{js,ts,jsx,tsx}"
        - "tools/*.{js,ts,jsx,tsx}"
        - ".claude/hooks/*.{js,ts,jsx,tsx}"
      run: bunx oxlint --type-aware {staged_files}
    format:
      glob: "*.{js,ts,jsx,tsx,json}"
      run: bunx oxfmt --check {staged_files}
pre-push:
  commands:
    check:
      run: bun run check
    typecheck:
      run: bun run typecheck
    cf-typegen-check:
      run: bun run cf-typegen:check
