# Check-only on pre-commit: auto-fix (--fix / --write + stage_fixed)
# rewrote staged content at commit time, so the committed bytes could differ
# from what the code-reviewer agent reviewed. A failing check tells the author
# to run `bun run check:fix` and re-stage — the reviewed diff is what lands.
pre-commit:
  commands:
    lint:
      # oxlint exits 1 with "No files found to lint" when every path it gets
      # is one it skips, so this lists only directories where it lints every
      # matching file. Root-level files carry ignore patterns and are covered
      # by `bun run check` on pre-push instead.
      glob:
        - "src/*.{js,ts,jsx,tsx}"
        - "tools/*.{js,ts,jsx,tsx}"
        - ".claude/hooks/*.{js,ts,jsx,tsx}"
      run: bunx oxlint --type-aware {staged_files}
    format:
      glob: "*.{js,ts,jsx,tsx,json}"
      run: bunx oxfmt --check {staged_files}
    # `--staged` reads the git index itself, so it needs no {staged_files}; the
    # glob only keeps a docs-only commit from paying for the scan. `--no-score`
    # drops the score API call, leaving the exit code the hook acts on.
    doctor:
      glob: "*.{js,ts,jsx,tsx}"
      run: bun run doctor --staged --no-score
pre-push:
  commands:
    check:
      run: bun run check
    typecheck:
      run: bun run typecheck
    cf-typegen-check:
      run: bun run cf-typegen:check
    # `similarity-ignore` comments are honoured by similarity-ts itself, and
    # without --fail-on-duplicates it exits 0 whatever it finds. The skip keeps a
    # machine that never installed this cargo binary from being unable to push
    # (AGENTS.md, "Degraded Environments").
    similarity:
      run: similarity-ts ./src --fail-on-duplicates
      skip:
        - run: "! command -v similarity-ts"
