name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # The smoke step starts a server and waits on it. Its own timers bound the
    # boot and each request; this bounds whatever they cannot.
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs every tool in mise.toml and exports them on PATH for the
      # steps below, so mise.toml is the one place those versions are written.
      - name: Install the toolchain from mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate route tree
        run: bun run generate-routes

      - name: Generate Cloudflare env types
        run: bun run cf-typegen

      # Fails on vulnerabilities in direct dependencies, and fails when `bun audit`
      # prints no JSON advisory report, which is what a registry or network error
      # leaves. Transitive advisories are printed without blocking: patching them
      # needs `overrides`, which add template debt, so direct deps are the audit
      # boundary and the rest waits for upstream.
      - name: Audit direct dependencies for known vulnerabilities
        run: bun scripts/audit-dependencies.entry.ts

      # Type-checks workflow expressions and validates action inputs, which YAML
      # syntax checking alone does not reach. With no arguments it walks
      # .github/workflows itself.
      - name: Lint GitHub Actions workflows (actionlint)
        run: actionlint

      # The shell counterpart of the step above, over every tracked `*.sh`: the
      # PreToolUse, Stop and SessionStart hooks and the two setup scripts. It
      # sits here rather than beside "Run Tests" so a finding in a hook fails
      # ahead of the check, dead-code, doctor, test and build steps below.
      - name: Lint the shell hooks and scripts (shellcheck)
        run: bun run check:shell

      # `bg-sidebar` and `text-chart-3` are tokens only src/styles.css defines,
      # so sorting them proves the formatter resolved that stylesheet. When it
      # cannot, oxfmt leaves the classes untouched and still exits 0, which no
      # other step in this file would notice.
      - name: Verify the formatter sorts Tailwind classes with the project theme
        shell: bash
        run: |
          set -euo pipefail
          # The probe has to sit inside the repository, because the formatter
          # discovers `fmt` from the config at the root. This step owns that
          # path: it refuses to run rather than overwrite a tracked file and
          # delete it out from under the steps below.
          probe=src/tailwind-sort-probe.tsx
          if [ -e "$probe" ]; then
            echo "::error file=$probe::this path is reserved for the formatter probe"
            exit 1
          fi
          trap 'rm -f "$probe"' EXIT
          printf 'export const P = () => <div className="p-4 bg-sidebar flex text-chart-3" />;\n' > "$probe"
          bunx vp fmt "$probe" > /dev/null
          expected='export const P = () => <div className="flex bg-sidebar p-4 text-chart-3" />;'
          if [ "$(cat "$probe")" != "$expected" ]; then
            echo "::error::the formatter did not sort Tailwind classes; check fmt.sortTailwindcss in vite.config.ts"
            echo "got:      $(cat "$probe")"
            echo "expected: $expected"
            exit 1
          fi

      - name: Verify the toolchain pins agree with vite-plus
        run: bun run check:pins

      - name: Check markdown links
        run: bun .claude/hooks/check-md-links.ts

      - name: Check Claude frontmatter parses
        run: bun scripts/check-claude-frontmatter.entry.ts

      # `vp check` runs format, lint and type checks in one pass, which is why
      # this workflow has no separate tsc step.
      - name: Run format, lint and type checks
        run: bun run check

      - name: Detect unused code (fallow)
        run: bun run dead-code

      # lefthook's pre-push runs this too, and `git push --no-verify` and a
      # clone that never ran `bun run setup` both get past that one. The script
      # rather than a bare `fallow dupes`, because the scope it passes is what
      # the ceiling is measured over.
      - name: Detect duplication (fallow)
        run: bun run dupes

      # Whole-tree counterpart of lefthook's pre-commit `--staged` run. `--no-score`
      # keeps the diagnostics off the vendor's score API; the exit code is what gates.
      - name: Scan React diagnostics (react-doctor)
        run: bun run doctor --no-score

      - name: Run Tests
        run: bun run test

      # Builds, applies the D1 migrations to a fresh local state, boots the
      # built Worker under workerd on it, requests the routes scripts/smoke.ts
      # names, and sends its sign-in burst.
      - name: Build the app and request its routes (smoke)
        run: bun run smoke
        # The Cloudflare plugin writes dist/server/.dev.vars only for a
        # `[secrets] required` name it finds a value for, and CI holds none.
        # This value gives it one, so smoke's check that the build left no such
        # file fails here once the file comes back.
        env:
          BETTER_AUTH_SECRET: ci-build-probe
