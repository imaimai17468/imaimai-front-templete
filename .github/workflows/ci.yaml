name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs every tool in mise.toml and exports them on PATH for the
      # steps below, so mise.toml is the one place the node, bun and actionlint
      # versions are written.
      - name: Install the toolchain from mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate route tree
        run: bun run generate-routes

      - name: Generate Cloudflare env types
        run: bun run cf-typegen

      # Fails only on vulnerabilities in direct dependencies. Transitive ones are
      # printed without blocking: patching them needs `overrides`, which add
      # template debt, so direct deps are the audit boundary and the rest waits for
      # upstream. `bun audit` is allowed to fail so a network or registry error does
      # not read as "no vulnerabilities".
      - name: Audit direct dependencies for known vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          DIRECT=$(jq -r '((.dependencies // {}) + (.devDependencies // {})) | keys | .[]' package.json | sort -u)
          VULN_JSON=$(bun audit --json 2>/dev/null || true)
          VULN_PKGS=$(printf '%s' "$VULN_JSON" | jq -r 'keys | .[]' | sort -u)
          if [ -z "$VULN_PKGS" ]; then
            echo "✅ No vulnerabilities found."
            exit 0
          fi
          DIRECT_VULNS=$(comm -12 <(printf '%s\n' "$DIRECT") <(printf '%s\n' "$VULN_PKGS") || true)
          if [ -n "$DIRECT_VULNS" ]; then
            echo "⛔ Vulnerabilities in direct dependencies:"
            printf '%s\n' "$DIRECT_VULNS"
            echo ""
            echo "Full audit output:"
            bun audit || true
            exit 1
          fi
          echo "ℹ️  Transitive-only vulnerabilities (not blocking):"
          printf '%s\n' "$VULN_PKGS" | sed 's/^/  - /'
          echo ""
          echo "✅ No direct-dependency vulnerabilities."

      # Type-checks workflow expressions and validates action inputs, which YAML
      # syntax checking alone does not reach. With no arguments it walks
      # .github/workflows itself.
      - name: Lint GitHub Actions workflows (actionlint)
        run: actionlint

      # `bg-sidebar` and `text-chart-3` are tokens only src/styles.css defines,
      # so sorting them proves the formatter resolved that stylesheet. When it
      # cannot, oxfmt leaves the classes untouched and still exits 0, which no
      # other step in this file would notice.
      - name: Verify the formatter sorts Tailwind classes with the project theme
        shell: bash
        run: |
          set -euo pipefail
          # The probe has to sit inside the repository, because the formatter
          # discovers `fmt` from the config at the root. This step owns that
          # path: it refuses to run rather than overwrite a tracked file and
          # delete it out from under the steps below.
          probe=src/tailwind-sort-probe.tsx
          if [ -e "$probe" ]; then
            echo "::error file=$probe::this path is reserved for the formatter probe"
            exit 1
          fi
          trap 'rm -f "$probe"' EXIT
          printf 'export const P = () => <div className="p-4 bg-sidebar flex text-chart-3" />;\n' > "$probe"
          bunx vp fmt "$probe" > /dev/null
          expected='export const P = () => <div className="flex bg-sidebar p-4 text-chart-3" />;'
          if [ "$(cat "$probe")" != "$expected" ]; then
            echo "::error::the formatter did not sort Tailwind classes; check fmt.sortTailwindcss in vite.config.ts"
            echo "got:      $(cat "$probe")"
            echo "expected: $expected"
            exit 1
          fi

      - name: Verify the toolchain pins agree with vite-plus
        run: bun run check:pins

      - name: Check markdown links
        run: bun .claude/hooks/check-md-links.ts

      # `vp check` runs format, lint and type checks in one pass, which is why
      # this workflow has no separate tsc step.
      - name: Run format, lint and type checks
        run: bun run check

      - name: Detect unused code (knip)
        run: bun run knip

      # Whole-tree counterpart of lefthook's pre-commit `--staged` run. `--no-score`
      # keeps the diagnostics off the vendor's score API; the exit code is what gates.
      - name: Scan React diagnostics (react-doctor)
        run: bun run doctor --no-score

      - name: Run Tests
        run: bun run test

      - name: Build Project
        run: bun run build
