name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Each job pays the shared setup once and runs beside the others, so the run
# takes as long as its slowest job rather than the sum of them. A new check
# goes into the job whose length it fits, or into a job of its own listed in
# the `needs` of `build` below, which the static job fails without.
jobs:
  static:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the toolchain and dependencies
        uses: ./.github/actions/setup

      # Fails on vulnerabilities in direct dependencies, and fails when `bun audit`
      # prints no JSON advisory report, which is what a registry or network error
      # leaves. Transitive advisories are printed without blocking: patching them
      # needs `overrides`, which add template debt, so direct deps are the audit
      # boundary and the rest waits for upstream.
      - name: Audit direct dependencies for known vulnerabilities
        run: bun .github/scripts/dependency-audit/audit-dependencies.entry.ts

      # Type-checks workflow expressions and validates action inputs, which YAML
      # syntax checking alone does not reach. With no arguments it walks
      # .github/workflows itself.
      - name: Lint GitHub Actions workflows (actionlint)
        run: actionlint

      # The shell counterpart of the step above, over every tracked `*.sh`: the
      # PreToolUse, Stop and SessionStart hooks and the two setup scripts.
      - name: Lint the shell hooks and scripts (shellcheck)
        run: bun run check:shell

      # `bg-sidebar` and `text-chart-3` are tokens only src/styles.css defines,
      # so sorting them proves the formatter resolved that stylesheet. When it
      # cannot, oxfmt leaves the classes untouched and still exits 0, which no
      # other step in this file would notice.
      - name: Verify the formatter sorts Tailwind classes with the project theme
        shell: bash
        run: |
          set -euo pipefail
          # The probe has to sit inside the repository, because the formatter
          # discovers `fmt` from the config at the root. This step owns that
          # path: it refuses to run rather than overwrite a tracked file and
          # delete it out from under the steps below.
          probe=src/tailwind-sort-probe.tsx
          if [ -e "$probe" ]; then
            echo "::error file=$probe::this path is reserved for the formatter probe"
            exit 1
          fi
          trap 'rm -f "$probe"' EXIT
          printf 'export const P = () => <div className="p-4 bg-sidebar flex text-chart-3" />;\n' > "$probe"
          bunx vp fmt "$probe" > /dev/null
          expected='export const P = () => <div className="flex bg-sidebar p-4 text-chart-3" />;'
          if [ "$(cat "$probe")" != "$expected" ]; then
            echo "::error::the formatter did not sort Tailwind classes; check fmt.sortTailwindcss in vite.config.ts"
            echo "got:      $(cat "$probe")"
            echo "expected: $expected"
            exit 1
          fi

      - name: Verify the toolchain pins agree with vite-plus
        run: bun run check:pins

      - name: Check Claude frontmatter parses
        run: bun scripts/claude-frontmatter/check-claude-frontmatter.entry.ts

      - name: Check the build job waits on every other job
        run: bun .github/scripts/ci-gate/check-ci-gate.entry.ts

      - name: Detect unused code (fallow)
        run: bun run dead-code

      # lefthook's pre-push runs this too, and `git push --no-verify` and a
      # clone that never ran `bun run setup` both get past that one. The script
      # rather than a bare `fallow dupes`, because the scope it passes is what
      # the ceiling is measured over.
      - name: Detect duplication (fallow)
        run: bun run dupes

  check:
    name: format, lint, type and Effect checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the toolchain and dependencies
        uses: ./.github/actions/setup

      # `vp check` runs format, lint and type checks in one pass, which is why
      # this workflow has no separate tsc step. The script runs the Effect
      # diagnostics `tsconfig.json` configures beside it.
      - name: Run format, lint, type and Effect checks
        run: bun run check

  doctor:
    name: react-doctor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the toolchain and dependencies
        uses: ./.github/actions/setup

      # `bun run check` runs react-doctor's lint rules as an oxlint plugin, but
      # its security-scan rules, such as `artifact-secret-leak`, run only in
      # this CLI's file scan. `--no-score` keeps the diagnostics off the
      # vendor's score API; the exit code is what gates.
      - name: Scan React diagnostics (react-doctor)
        run: bun run doctor --no-score

  # Vitest's `--shard` splits the test files by count, whatever each one takes
  # to run, so the shards' file counts differ by at most one. Adding an entry
  # to `shard` adds a shard.
  test-shard:
    name: tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the toolchain and dependencies
        uses: ./.github/actions/setup

      # A shard's tests reach only some branches of each source file, so this
      # step turns the per-file branch threshold off and the tests job checks
      # it on the merged report. The blob reporter prints nothing about a
      # failure, which the default and github-actions reporters print here.
      - name: Run this shard's tests
        run: bun run test --coverage.thresholds.branches=0 --reporter=default --reporter=github-actions --reporter=blob --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload the shard's report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-shard-${{ matrix.shard }}
          path: .vitest/blob
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  test:
    name: tests
    needs: test-shard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the toolchain and dependencies
        uses: ./.github/actions/setup

      # Each shard names its blob after its index, so the reports land side by
      # side in the directory `--merge-reports` reads.
      - name: Download every shard's report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-shard-*
          path: .vitest/blob
          merge-multiple: true

      - name: Merge the reports and check coverage
        run: bun run test --merge-reports

  bundle:
    name: worker build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the toolchain and dependencies
        uses: ./.github/actions/setup

      # The build `void deploy` runs, without deploying, so a change that
      # breaks the production bundle fails here.
      - name: Build the Worker
        run: bun run build

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    # The smoke step starts a server and waits on it. Its own timers bound the
    # boot and each request; this bounds whatever they cannot.
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the toolchain and dependencies
        uses: ./.github/actions/setup

      # Boots the dev server on an empty local D1 and R2, which applies the D1
      # migrations, requests the routes scripts/smoke/smoke.ts names, and sends
      # its sign-in burst. It reads no Cloudflare account.
      - name: Boot the app and request its routes (smoke)
        run: bun run smoke

  # Reports every job above as one check, which fails when any of them did not
  # succeed. `!cancelled()` runs it after a failed job too, where
  # a plain `needs` would skip it and leave the check with neither a pass nor
  # a fail to report.
  build:
    name: build
    if: ${{ !cancelled() }}
    needs: [static, check, doctor, test-shard, test, bundle, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::a job this check waits on ended as $result"
              exit 1
            fi
          done
