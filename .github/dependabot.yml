version: 2
updates:
  # `bun` rather than `npm`, so Dependabot regenerates bun.lock alongside
  # package.json. Under `npm` it leaves bun.lock behind, and
  # `bun install --frozen-lockfile` then fails on the mismatch.
  # This ecosystem opens version-update PRs only, not security updates.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase
    # Dependabot skips a version released less than 7 days ago. GitHub applies
    # 3 days when this key is absent.
    cooldown:
      default-days: 7
    groups:
      tanstack:
        patterns:
          - "@tanstack/*"
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
